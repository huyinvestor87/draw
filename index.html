<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Vẽ</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#111111">
<style>
  :root{
    --bar-h: 64px;
    color-scheme: light dark;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    overflow:hidden; overscroll-behavior:none;
    background:#1c1c1e;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
    touch-action:none;
    user-select:none;
    -webkit-user-select:none;
  }
  #app{
    position:fixed; inset:0;
    display:flex; flex-direction:column;
  }
  #canvasWrap{
    position:relative;
    flex:1;
    min-height:0;
    background:#ffffff;
    touch-action:none;
  }
  canvas{
    position:absolute; inset:0;
    width:100%; height:100%;
    display:block;
    touch-action:none;
  }
  #bar{
    height:var(--bar-h);
    padding:0 10px;
    padding-bottom: env(safe-area-inset-bottom, 0px);
    height: calc(var(--bar-h) + env(safe-area-inset-bottom, 0px));
    background:rgba(28,28,30,0.96);
    backdrop-filter: blur(10px);
    display:flex;
    align-items:center;
    gap:10px;
    overflow-x:auto;
    flex-shrink:0;
  }
  #bar::-webkit-scrollbar{ display:none; }

  .swatch{
    width:34px; height:34px; border-radius:50%;
    border:2px solid rgba(255,255,255,0.25);
    flex:0 0 auto;
    padding:0;
    background:#000;
    cursor:pointer;
  }
  .swatch.active{
    border-color:#fff;
    box-shadow:0 0 0 2px rgba(255,255,255,0.5);
  }

  #colorPicker{
    -webkit-appearance:none; appearance:none;
    width:34px; height:34px; border-radius:50%;
    border:2px solid rgba(255,255,255,0.25);
    padding:0; background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red);
    flex:0 0 auto;
    overflow:hidden;
  }
  #colorPicker::-webkit-color-swatch-wrapper{ padding:0; }
  #colorPicker::-webkit-color-swatch{ border:none; border-radius:50%; }

  .sep{
    width:1px; height:28px; background:rgba(255,255,255,0.15);
    flex:0 0 auto;
  }

  #sizeWrap{
    display:flex; align-items:center; gap:8px;
    flex:0 0 auto;
  }
  #sizeDot{
    width:20px; height:20px; border-radius:50%;
    background:#fff;
    flex:0 0 auto;
    transition: width .1s, height .1s;
  }
  input[type=range]{
    width:110px;
    flex:0 0 auto;
  }

  .btn{
    flex:0 0 auto;
    height:38px;
    padding:0 14px;
    border-radius:19px;
    border:none;
    background:rgba(255,255,255,0.12);
    color:#fff;
    font-size:15px;
    font-weight:500;
    display:flex; align-items:center; justify-content:center;
    gap:6px;
    white-space:nowrap;
  }
  .btn:active{ background:rgba(255,255,255,0.25); }
  .btn.icon{
    width:38px; padding:0;
  }
  .btn svg{ width:18px; height:18px; }

  #eraseBtn.active{
    background:#0a84ff;
  }

  #hint{
    position:absolute;
    left:50%; top:14px;
    transform:translateX(-50%);
    background:rgba(28,28,30,0.85);
    color:#fff;
    font-size:13px;
    padding:8px 14px;
    border-radius:14px;
    pointer-events:none;
    white-space:nowrap;
    opacity:1;
    transition:opacity .6s ease;
  }
  #hint.hidden{ opacity:0; }
</style>
</head>
<body>
<div id="app">
  <div id="canvasWrap">
    <canvas id="c"></canvas>
    <div id="hint">Chạm 2 ngón tay để kéo xem vùng khác</div>
  </div>
  <div id="bar">
    <button class="swatch active" data-color="#000000" style="background:#000000"></button>
    <button class="swatch" data-color="#ff3b30" style="background:#ff3b30"></button>
    <button class="swatch" data-color="#ff9500" style="background:#ff9500"></button>
    <button class="swatch" data-color="#ffcc00" style="background:#ffcc00"></button>
    <button class="swatch" data-color="#34c759" style="background:#34c759"></button>
    <button class="swatch" data-color="#0a84ff" style="background:#0a84ff"></button>
    <button class="swatch" data-color="#5856d6" style="background:#5856d6"></button>
    <input type="color" id="colorPicker" value="#000000" title="Màu tuỳ chỉnh">

    <div class="sep"></div>

    <div id="sizeWrap">
      <div id="sizeDot"></div>
      <input type="range" id="sizeRange" min="1" max="60" value="6">
    </div>

    <div class="sep"></div>

    <button class="btn" id="eraseBtn" title="Tẩy">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20H8L3.5 15.5a1.5 1.5 0 0 1 0-2.1l9-9a1.5 1.5 0 0 1 2.1 0l5.5 5.5a1.5 1.5 0 0 1 0 2.1L13.5 19"/></svg>
      <span>Tẩy</span>
    </button>
    <button class="btn icon" id="undoBtn" title="Hoàn tác">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-15-6.7L3 13"/></svg>
    </button>
    <button class="btn icon" id="homeBtn" title="Về gốc">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg>
    </button>
    <button class="btn" id="clearBtn">Xoá hết</button>
    <button class="btn" id="saveBtn">Lưu ảnh</button>
  </div>
</div>

<script>
(function(){
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d', { willReadFrequently:false });
  const wrap = document.getElementById('canvasWrap');
  const hint = document.getElementById('hint');
  const sizeRange = document.getElementById('sizeRange');
  const sizeDot = document.getElementById('sizeDot');
  const colorPicker = document.getElementById('colorPicker');
  const swatches = Array.from(document.querySelectorAll('.swatch'));
  const eraseBtn = document.getElementById('eraseBtn');
  const undoBtn = document.getElementById('undoBtn');
  const homeBtn = document.getElementById('homeBtn');
  const clearBtn = document.getElementById('clearBtn');
  const saveBtn = document.getElementById('saveBtn');

  let color = '#000000';
  let size = parseInt(sizeRange.value, 10);
  let erasing = false;
  let dpr = Math.max(1, window.devicePixelRatio || 1);

  // The canvas element only ever covers the viewport, but the drawing
  // itself is infinite: every stroke is stored in "world" coordinates and
  // panOffset says which part of that world is currently visible. This
  // gives unlimited room to draw without needing a giant bitmap.
  const strokes = [];
  let currentStroke = null;
  const panOffset = { x: 0, y: 0 };
  const GRID_SPACING = 48;

  setTimeout(() => hint.classList.add('hidden'), 3500);

  function resizeCanvas(){
    dpr = Math.max(1, window.devicePixelRatio || 1);
    const w = wrap.clientWidth;
    const h = wrap.clientHeight;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    redraw();
  }

  function strokeBaseWidth(s){
    return s.erase ? s.size * 1.5 : s.size;
  }

  function renderStroke(targetCtx, s){
    if (!s.points.length) return;
    const baseSize = strokeBaseWidth(s);
    targetCtx.fillStyle = s.erase ? '#ffffff' : s.color;
    targetCtx.strokeStyle = s.erase ? '#ffffff' : s.color;

    const p0 = s.points[0];
    const r0 = baseSize / 2 * p0.pressure * 0.9 + (baseSize / 2) * 0.1;
    targetCtx.beginPath();
    targetCtx.arc(p0.x, p0.y, Math.max(0.5, r0), 0, Math.PI * 2);
    targetCtx.fill();

    for (let i = 1; i < s.points.length; i++){
      const a = s.points[i - 1], b = s.points[i];
      targetCtx.lineWidth = baseSize * (0.4 + b.pressure * 0.6);
      targetCtx.beginPath();
      targetCtx.moveTo(a.x, a.y);
      targetCtx.lineTo(b.x, b.y);
      targetCtx.stroke();
    }
  }

  function drawGrid(w, h){
    const minX = Math.floor(-panOffset.x / GRID_SPACING) * GRID_SPACING;
    const minY = Math.floor(-panOffset.y / GRID_SPACING) * GRID_SPACING;
    const maxX = w - panOffset.x;
    const maxY = h - panOffset.y;
    ctx.fillStyle = 'rgba(0,0,0,0.10)';
    for (let x = minX; x <= maxX; x += GRID_SPACING){
      for (let y = minY; y <= maxY; y += GRID_SPACING){
        ctx.beginPath();
        ctx.arc(x, y, 1.3, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  function redraw(){
    const w = wrap.clientWidth, h = wrap.clientHeight;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, w, h);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    ctx.save();
    ctx.translate(panOffset.x, panOffset.y);
    drawGrid(w, h);
    for (const s of strokes) renderStroke(ctx, s);
    if (currentStroke) renderStroke(ctx, currentStroke);
    ctx.restore();
  }

  function undo(){
    if (!strokes.length) return;
    strokes.pop();
    redraw();
  }

  function updateSizeDot(){
    const d = Math.max(4, Math.min(34, size));
    sizeDot.style.width = d + 'px';
    sizeDot.style.height = d + 'px';
    sizeDot.style.background = erasing ? '#ffffff' : color;
    sizeDot.style.border = erasing ? '1px solid rgba(255,255,255,0.4)' : 'none';
  }

  function setColor(c){
    color = c;
    erasing = false;
    eraseBtn.classList.remove('active');
    colorPicker.value = c;
    swatches.forEach(s => s.classList.toggle('active', s.dataset.color.toLowerCase() === c.toLowerCase()));
    updateSizeDot();
  }

  swatches.forEach(s => {
    s.addEventListener('click', () => setColor(s.dataset.color));
  });
  colorPicker.addEventListener('input', () => {
    color = colorPicker.value;
    erasing = false;
    eraseBtn.classList.remove('active');
    swatches.forEach(s => s.classList.remove('active'));
    updateSizeDot();
  });

  sizeRange.addEventListener('input', () => {
    size = parseInt(sizeRange.value, 10);
    updateSizeDot();
  });

  eraseBtn.addEventListener('click', () => {
    erasing = !erasing;
    eraseBtn.classList.toggle('active', erasing);
    updateSizeDot();
  });

  undoBtn.addEventListener('click', undo);

  homeBtn.addEventListener('click', () => {
    panOffset.x = 0; panOffset.y = 0;
    redraw();
  });

  clearBtn.addEventListener('click', () => {
    strokes.length = 0;
    currentStroke = null;
    redraw();
  });

  saveBtn.addEventListener('click', () => {
    let dataUrl;
    if (strokes.length){
      // Export the bounding box of everything ever drawn, not just the
      // part currently visible on screen.
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      for (const s of strokes){
        const pad = strokeBaseWidth(s) / 2 + 2;
        for (const p of s.points){
          minX = Math.min(minX, p.x - pad); maxX = Math.max(maxX, p.x + pad);
          minY = Math.min(minY, p.y - pad); maxY = Math.max(maxY, p.y + pad);
        }
      }
      const margin = 20;
      minX -= margin; minY -= margin; maxX += margin; maxY += margin;
      const w = Math.max(1, Math.ceil(maxX - minX));
      const h = Math.max(1, Math.ceil(maxY - minY));
      const off = document.createElement('canvas');
      off.width = Math.round(w * dpr);
      off.height = Math.round(h * dpr);
      const octx = off.getContext('2d');
      octx.setTransform(dpr, 0, 0, dpr, 0, 0);
      octx.fillStyle = '#ffffff';
      octx.fillRect(0, 0, w, h);
      octx.lineCap = 'round';
      octx.lineJoin = 'round';
      octx.translate(-minX, -minY);
      for (const s of strokes) renderStroke(octx, s);
      dataUrl = off.toDataURL('image/png');
    } else {
      dataUrl = canvas.toDataURL('image/png');
    }
    const link = document.createElement('a');
    link.download = 've-' + Date.now() + '.png';
    link.href = dataUrl;
    link.click();
  });

  // --- Drawing + two-finger panning ---
  // One finger / pen draws. A second touch cancels any in-progress stroke
  // and switches to panning the infinite canvas instead.
  let drawing = false;
  let drawPointerId = null;
  const activeTouches = new Map(); // pointerId -> {x, y}
  let panning = false;
  let panLast = null;

  function getPos(e){
    const rect = canvas.getBoundingClientRect();
    return {
      x: e.clientX - rect.left,
      y: e.clientY - rect.top,
      pressure: (e.pointerType === 'pen' && e.pressure > 0) ? e.pressure : 1
    };
  }

  function toWorld(p){
    return { x: p.x - panOffset.x, y: p.y - panOffset.y, pressure: p.pressure };
  }

  function touchCentroid(){
    let x = 0, y = 0;
    for (const p of activeTouches.values()){ x += p.x; y += p.y; }
    const n = activeTouches.size;
    return { x: x / n, y: y / n };
  }

  function cancelDrawing(){
    if (!drawing) return;
    drawing = false;
    drawPointerId = null;
    currentStroke = null;
    redraw();
  }

  function pointerDown(e){
    const p = getPos(e);
    if (e.pointerType === 'touch') activeTouches.set(e.pointerId, p);
    canvas.setPointerCapture(e.pointerId);

    if (e.pointerType === 'touch' && activeTouches.size >= 2){
      cancelDrawing();
      panning = true;
      panLast = touchCentroid();
      hint.classList.add('hidden');
      return;
    }

    if (panning || drawing) return;
    drawing = true;
    drawPointerId = e.pointerId;
    currentStroke = { color, size, erase: erasing, points: [toWorld(p)] };
    redraw();
  }

  function pointerMove(e){
    if (panning){
      if (e.pointerType === 'touch' && activeTouches.has(e.pointerId)){
        activeTouches.set(e.pointerId, getPos(e));
        const centroid = touchCentroid();
        panOffset.x += centroid.x - panLast.x;
        panOffset.y += centroid.y - panLast.y;
        panLast = centroid;
        redraw();
      }
      return;
    }
    if (!drawing || e.pointerId !== drawPointerId) return;
    const p = getPos(e);
    currentStroke.points.push(toWorld(p));
    redraw();
  }

  function pointerUp(e){
    if (e.pointerType === 'touch') activeTouches.delete(e.pointerId);
    try{ canvas.releasePointerCapture(e.pointerId); }catch(err){}

    if (panning){
      if (activeTouches.size === 0){
        panning = false;
        panLast = null;
      } else {
        panLast = touchCentroid();
      }
      return;
    }
    if (drawing && e.pointerId === drawPointerId){
      if (currentStroke && currentStroke.points.length) strokes.push(currentStroke);
      currentStroke = null;
      drawing = false;
      drawPointerId = null;
      redraw();
    }
  }

  canvas.addEventListener('pointerdown', pointerDown);
  canvas.addEventListener('pointermove', pointerMove);
  canvas.addEventListener('pointerup', pointerUp);
  canvas.addEventListener('pointercancel', pointerUp);
  canvas.addEventListener('pointerleave', (e) => { if (drawing && e.pointerId === drawPointerId) pointerUp(e); });

  // Prevent iOS gestures (pinch-zoom, double-tap-zoom, scroll) inside canvas.
  ['touchstart','touchmove','touchend'].forEach(evt => {
    canvas.addEventListener(evt, (e) => e.preventDefault(), { passive:false });
  });
  document.addEventListener('gesturestart', (e) => e.preventDefault());
  document.addEventListener('dblclick', (e) => e.preventDefault());

  window.addEventListener('resize', resizeCanvas);
  window.addEventListener('orientationchange', resizeCanvas);

  resizeCanvas();
  updateSizeDot();
})();
</script>
</body>
</html>
